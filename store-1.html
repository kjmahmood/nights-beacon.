<title>Night's Beacon Perfumes</title>
<meta name="description" content="Night's Beacon (منارة الليل) — perfumes from Mosul, Iraq. Browse the collection, build a Discovery Set and order via WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap">
<style>
/* Layout concept: midnight-sky boutique. One centered column system, products first,
   thin gold rules, generous negative space, a single glowing "beacon" in the hero. */
:root{
  --navy-950:#060b1c;
  --navy-900:#0a1230;
  --navy-800:#0f1a40;
  --navy-700:#16245a;
  --gold:#c9a96a;
  --champagne:#e9d8ae;
  --ink:#f4f1e8;
  --ink-soft:#b9bfd3;
  --ink-mute:#8790ad;
  --line:rgba(201,169,106,.26);
  --line-soft:rgba(201,169,106,.14);
  --wa:#25d366;
  --danger:#ff9a8a;
  --font-display:'Cormorant Garamond','Times New Roman',serif;
  --font-body:'Jost','Helvetica Neue',Arial,sans-serif;
  --radius:3px;
  color-scheme:dark;
}
html[lang="ar"]{
  --font-display:'Amiri','Times New Roman',serif;
  --font-body:'Tajawal','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--navy-950);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  font-weight:400;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--champagne);outline-offset:3px}
.wrap{width:min(1180px,100%);margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}
.eyebrow{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500}
html[lang="ar"] .eyebrow{letter-spacing:.04em;text-transform:none;font-size:.85rem}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55;border:0;margin:0}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(6,11,28,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.hdr-row{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand svg,.brand img{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--font-display);font-size:1.3rem;letter-spacing:.06em;color:var(--champagne);white-space:nowrap}
html[lang="ar"] .brand-name{letter-spacing:0;font-size:1.45rem}
.nav{display:none;margin-inline-start:auto;gap:26px}
.nav a{text-decoration:none;font-size:.86rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:6px 0;border-bottom:1px solid transparent;transition:color .25s,border-color .25s}
html[lang="ar"] .nav a{letter-spacing:0;text-transform:none;font-size:.95rem}
.nav a:hover,.nav a[aria-current="page"]{color:var(--champagne);border-color:var(--gold)}
.hdr-tools{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.icon-btn{position:relative;display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 10px;background:none;border:1px solid transparent;border-radius:var(--radius);color:var(--ink);transition:border-color .25s,color .25s}
.icon-btn:hover{border-color:var(--line);color:var(--champagne)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.lang-btn{font-size:.9rem;letter-spacing:.04em;color:var(--champagne)}
.badge{position:absolute;top:3px;inset-inline-end:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--navy-950);font-size:.72rem;font-weight:500;line-height:18px;text-align:center}
.menu-panel{display:none;border-top:1px solid var(--line-soft);padding-block:8px 14px}
.menu-panel a{display:block;padding:12px 0;text-decoration:none;color:var(--ink-soft);border-bottom:1px solid var(--line-soft);font-size:1rem}
.menu-open .menu-panel{display:block}
@media(min-width:960px){.nav{display:flex}.menu-btn{display:none}.menu-panel{display:none!important}.hdr-tools{margin-inline-start:26px}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 22px;border-radius:var(--radius);border:1px solid var(--gold);background:transparent;color:var(--champagne);text-decoration:none;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:background .25s,color .25s,border-color .25s,opacity .25s;text-align:center}
html[lang="ar"] .btn{letter-spacing:0;text-transform:none;font-size:.95rem}
.btn:hover{background:rgba(201,169,106,.12)}
.btn-gold{background:linear-gradient(180deg,#d8bb7c,#b8964f);color:var(--navy-950);border-color:#d8bb7c}
.btn-gold:hover{background:linear-gradient(180deg,#e6cd93,#c9a96a)}
.btn-wa{border-color:rgba(37,211,102,.55);color:#bff3d2}
.btn-wa:hover{background:rgba(37,211,102,.12)}
.btn-wa svg{width:18px;height:18px;fill:currentColor;flex:none}
.btn-block{width:100%}
.btn-sm{min-height:40px;padding:8px 14px;font-size:.72rem}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--champagne);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}

/* Hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line-soft);
  background:
    radial-gradient(1.2px 1.2px at 12% 18%,rgba(233,216,174,.8),transparent 60%),
    radial-gradient(1px 1px at 28% 62%,rgba(233,216,174,.55),transparent 60%),
    radial-gradient(1.4px 1.4px at 44% 12%,rgba(233,216,174,.7),transparent 60%),
    radial-gradient(1px 1px at 63% 36%,rgba(233,216,174,.5),transparent 60%),
    radial-gradient(1.2px 1.2px at 78% 14%,rgba(233,216,174,.8),transparent 60%),
    radial-gradient(1px 1px at 90% 58%,rgba(233,216,174,.55),transparent 60%),
    radial-gradient(1px 1px at 6% 82%,rgba(233,216,174,.5),transparent 60%),
    radial-gradient(ellipse at 70% 40%,var(--navy-700) 0%,var(--navy-900) 45%,var(--navy-950) 100%)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:center;padding-block:44px 52px}
.hero h1{font-size:clamp(2.5rem,8.4vw,4.6rem);color:var(--ink);margin-block:14px 16px}
.hero h1 em{font-style:italic;color:var(--champagne)}
.hero p.lead{color:var(--ink-soft);font-size:1.08rem;max-width:34ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero-tag{margin-top:26px;font-family:var(--font-display);font-style:italic;font-size:1.15rem;color:var(--gold)}
.hero-art{position:relative;display:grid;place-items:center;min-height:300px}
.hero-art .halo{position:absolute;width:min(420px,90%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(233,216,174,.2),rgba(233,216,174,.05) 45%,transparent 68%)}
.hero-art .moon{position:absolute;top:2%;inset-inline-end:8%;width:62px;height:62px;opacity:.9}
.hero-art .bottle{position:relative;width:min(220px,52vw);filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
@media(min-width:820px){.hero-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;padding-block:72px 80px}.hero-art{min-height:460px}.hero-art .bottle{width:min(270px,30vw)}}

/* Sections */
.section{padding-block:clamp(52px,9vw,96px);scroll-margin-top:72px}
.section-head{display:grid;gap:10px;margin-bottom:clamp(26px,5vw,44px);max-width:640px}
.section-head h2{font-size:clamp(2rem,5.4vw,3rem);color:var(--ink)}
.section-head p{color:var(--ink-soft)}
.center{text-align:center;margin-inline:auto;justify-items:center}

/* Product grid & card */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.grid{gap:18px}}
@media(min-width:940px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,rgba(22,36,90,.35),rgba(10,18,48,.6));border:1px solid var(--line-soft);border-radius:var(--radius);transition:border-color .3s,transform .3s}
.card:hover{border-color:var(--line)}
.card-media{display:grid;place-items:center;aspect-ratio:4/5;max-width:100%;padding:18px 14px 8px;background:radial-gradient(ellipse at 50% 38%,rgba(233,216,174,.12),transparent 62%);text-decoration:none}
.card-media svg,.card-media img{height:100%;width:auto;max-width:100%;object-fit:contain;transition:transform .5s}
.card:hover .card-media svg,.card:hover .card-media img{transform:translateY(-3px)}
.card-body{display:flex;flex-direction:column;gap:8px;padding:12px 12px 14px;flex:1;min-width:0}
.card h3{font-size:1.3rem;color:var(--champagne)}
.card h3 a{text-decoration:none}
.card .desc{font-size:.85rem;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta-line{font-size:.76rem;color:var(--ink-mute);overflow-wrap:anywhere}
.meta-line b{font-weight:500;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:.68rem}
html[lang="ar"] .meta-line b{letter-spacing:0;text-transform:none;font-size:.8rem}
.price{font-family:var(--font-display);font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
.price small{font-family:var(--font-body);font-size:.72rem;color:var(--ink-mute);letter-spacing:.06em}
.price.tbc{font-size:1rem;font-style:italic;color:var(--ink-soft)}
.card-actions{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;margin-top:auto}
.card-actions .btn-block{grid-column:1/-1}
.card-actions .btn{letter-spacing:.07em;padding-inline:8px;font-size:.68rem}
.select,.input,.textarea{width:100%;min-height:44px;padding:9px 12px;background:rgba(6,11,28,.7);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);font-size:.95rem}
.select{appearance:auto}
.textarea{min-height:88px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--champagne)}
.tag-soldout{font-size:.72rem;color:var(--danger);letter-spacing:.1em;text-transform:uppercase}

/* Product page */
.crumbs{padding-block:20px 0;font-size:.82rem;color:var(--ink-mute)}
.crumbs a{text-decoration:none;color:var(--ink-soft)}
.pp{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding-block:20px 40px}
@media(min-width:860px){.pp{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding-block:32px 60px}}
.pp-media{display:grid;place-items:center;aspect-ratio:1;max-width:100%;border:1px solid var(--line-soft);background:radial-gradient(ellipse at 50% 42%,rgba(233,216,174,.16),rgba(15,26,64,.5) 60%,var(--navy-900));padding:6%}
.pp-media svg,.pp-media img{height:100%;width:auto;max-width:100%;object-fit:contain}
.pp-info{display:grid;gap:22px;align-content:start;min-width:0}
.pp-info h1{font-size:clamp(2.2rem,6vw,3.3rem);color:var(--champagne)}
.pp-info .price{font-size:1.7rem}
.label{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:block}
html[lang="ar"] .label{letter-spacing:0;text-transform:none;font-size:.88rem}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:8px 18px;border:1px solid var(--line);background:transparent;border-radius:var(--radius);font-size:.9rem;color:var(--ink-soft);transition:all .25s}
.pill[aria-pressed="true"],.pill[aria-checked="true"]{border-color:var(--gold);background:rgba(201,169,106,.14);color:var(--champagne)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:.85rem;color:var(--ink-soft)}
.chip.tbc{border-style:dashed;color:var(--ink-mute);font-style:italic}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.note-card{border:1px solid var(--line-soft);background:rgba(15,26,64,.45);padding:14px 10px;display:grid;gap:8px;align-content:start;text-align:center;min-width:0}
.note-card svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.2;margin-inline:auto}
.note-card h4{font-family:var(--font-body);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:500}
html[lang="ar"] .note-card h4{letter-spacing:0;text-transform:none;font-size:.82rem}
.note-card p{font-size:.88rem;color:var(--ink);overflow-wrap:anywhere}
.note-card p.tbc{color:var(--ink-mute);font-style:italic}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius)}
.qty button{width:44px;height:44px;border:0;background:none;font-size:1.3rem;color:var(--champagne)}
.qty button:hover{background:rgba(201,169,106,.12)}
.qty output{min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.buy{display:grid;gap:10px}
.buy-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.fine{font-size:.8rem;color:var(--ink-mute)}

/* Discovery */
.disc{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:center;padding:clamp(22px,5vw,52px);border:1px solid var(--line);background:linear-gradient(135deg,rgba(22,36,90,.55),rgba(10,18,48,.85));position:relative}
.disc::before{content:"";position:absolute;inset:7px;border:1px solid var(--line-soft);pointer-events:none}
@media(min-width:860px){.disc{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:50px}}
.disc-art{display:grid;place-items:center;min-height:220px;background:radial-gradient(ellipse at 50% 55%,rgba(233,216,174,.14),transparent 65%)}
.disc-art svg{width:min(380px,100%);height:auto}
.disc h2{font-size:clamp(2rem,5vw,2.9rem);color:var(--champagne)}
.disc-copy{display:grid;gap:16px;min-width:0;position:relative}
.ticks{list-style:none;padding:0;margin:0;display:grid;gap:8px;color:var(--ink-soft);font-size:.95rem}
.ticks li::before{content:"";display:inline-block;width:6px;height:6px;margin-inline-end:10px;background:var(--gold);transform:rotate(45deg)}
.picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:700px){.picker{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pick{display:grid;gap:4px;justify-items:center;padding:10px 6px;border:1px solid var(--line-soft);background:rgba(15,26,64,.4);border-radius:var(--radius);color:var(--ink-soft);min-height:84px;transition:all .25s;text-align:center;min-width:0}
.pick svg{height:54px;width:auto}
.pick span{font-family:var(--font-display);font-size:1.05rem;line-height:1.1;overflow-wrap:anywhere}
.pick[aria-pressed="true"]{border-color:var(--gold);background:rgba(201,169,106,.16);color:var(--champagne)}
.pick:disabled{opacity:.4}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{min-height:56px;display:grid;place-items:center;padding:6px;border:1px dashed var(--line);text-align:center;font-size:.85rem;color:var(--ink-mute);border-radius:var(--radius);overflow-wrap:anywhere}
.slot.on{border-style:solid;border-color:var(--gold);color:var(--champagne);font-family:var(--font-display);font-size:1.05rem}

/* About / steps / gallery / faq */
.about{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:center}
@media(min-width:860px){.about{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:64px}}
.about-art{display:grid;place-items:center;aspect-ratio:1;max-width:340px;width:100%;margin-inline:auto;border:1px solid var(--line-soft);background:radial-gradient(circle at 50% 40%,rgba(233,216,174,.12),transparent 66%)}
.about-art svg{width:56%;height:auto}
.about-text{display:grid;gap:18px;font-size:1.12rem;color:var(--ink-soft);max-width:52ch}
.about-text strong{font-family:var(--font-display);font-weight:500;font-size:1.5rem;color:var(--champagne);font-style:italic}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;list-style:none;padding:0;margin:0}
@media(min-width:900px){.steps{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}}
.steps li{padding:20px 16px;border-top:1px solid var(--gold);background:rgba(15,26,64,.35);display:grid;gap:8px;align-content:start;min-width:0}
.steps h3{font-size:1.25rem;color:var(--champagne)}
.steps p{font-size:.9rem;color:var(--ink-soft)}
.steps svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.2}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:800px){.gallery{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}}
.tile{aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line-soft);background:radial-gradient(circle at 50% 40%,rgba(233,216,174,.12),rgba(10,18,48,.9) 70%);overflow:hidden;min-width:0}
.tile svg,.tile img{width:62%;height:62%;object-fit:contain}
.tile img{width:100%;height:100%;object-fit:cover}
.follow{display:grid;gap:22px;justify-items:center;text-align:center}
.faq{display:grid;gap:0;max-width:760px}
.faq details{border-bottom:1px solid var(--line-soft)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 0;font-family:var(--font-display);font-size:1.3rem;color:var(--champagne)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--font-body);font-size:1.3rem;color:var(--gold);flex:none}
.faq details[open] summary::after{content:"–"}
.faq p{padding-bottom:20px;color:var(--ink-soft);max-width:62ch}

/* Cart & checkout */
.page-title{font-size:clamp(2.1rem,6vw,3.2rem);color:var(--champagne);padding-block:36px 8px}
.empty{padding-block:48px;display:grid;gap:18px;justify-items:start;color:var(--ink-soft)}
.cart-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding-block:20px 60px}
@media(min-width:900px){.cart-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px}}
.line{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding-block:18px;border-bottom:1px solid var(--line-soft)}
.line-img{display:grid;place-items:center;height:92px;background:rgba(15,26,64,.5);border:1px solid var(--line-soft)}
.line-img svg,.line-img img{height:84%;width:auto;max-width:90%}
.line h3{font-size:1.25rem;color:var(--champagne)}
.line-info{display:grid;gap:8px;min-width:0}
.line-info .sub{font-size:.85rem;color:var(--ink-soft);overflow-wrap:anywhere}
.line-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.line .select{width:auto;min-width:104px}
.rm{background:none;border:0;color:var(--ink-mute);text-decoration:underline;text-underline-offset:3px;font-size:.85rem;min-height:44px;padding:0 4px}
.rm:hover{color:var(--danger)}
.summary{border:1px solid var(--line);padding:22px;background:rgba(15,26,64,.4);display:grid;gap:14px;align-content:start;height:max-content}
.summary h2{font-size:1.6rem;color:var(--champagne)}
.sum-row{display:flex;justify-content:space-between;gap:14px;font-size:.95rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sum-row.total{font-size:1.15rem;color:var(--ink);padding-top:12px;border-top:1px solid var(--line)}
.form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label,.field legend{font-size:.82rem;letter-spacing:.06em;color:var(--ink-soft)}
.field .err{font-size:.8rem;color:var(--danger);min-height:1em}
.input[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--danger)}
fieldset{border:0;padding:0;margin:0;min-width:0}
.pay{display:grid;gap:8px}
.pay label{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line-soft);border-radius:var(--radius);cursor:pointer;min-height:56px}
.pay input{margin-top:5px;accent-color:var(--gold);width:18px;height:18px;flex:none}
.pay label:has(input:checked){border-color:var(--gold);background:rgba(201,169,106,.1)}
.pay b{display:block;font-weight:500;color:var(--ink)}
.pay span{font-size:.85rem;color:var(--ink-mute)}
.panel{padding:14px 16px;border:1px solid var(--line);background:rgba(6,11,28,.6);font-size:.9rem;color:var(--ink-soft);display:grid;gap:10px;border-radius:var(--radius)}
.panel.ok{border-color:rgba(37,211,102,.5)}
.copy-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.copy-row code{font-family:var(--font-body);color:var(--champagne);letter-spacing:.06em;user-select:all;overflow-wrap:anywhere}
.review{display:grid;gap:8px;font-size:.9rem;color:var(--ink-soft)}
.review li{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.review ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.review span:first-child{min-width:0;overflow-wrap:anywhere}

/* Footer */
.ftr{border-top:1px solid var(--line-soft);background:var(--navy-900);padding-block:48px 100px}
.ftr-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
@media(min-width:800px){.ftr-grid{grid-template-columns:1.3fr 1fr 1fr}}
.ftr h4{font-family:var(--font-body);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:12px}
html[lang="ar"] .ftr h4{letter-spacing:0;text-transform:none;font-size:.9rem}
.ftr ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;color:var(--ink-soft);font-size:.92rem}
.ftr a{text-decoration:none}
.ftr a:hover{color:var(--champagne)}
.ftr .small{margin-top:34px;padding-top:18px;border-top:1px solid var(--line-soft);font-size:.78rem;color:var(--ink-mute)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* Floating WhatsApp + toast */
.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 18px;border-radius:999px;background:#128c4a;color:#fff;text-decoration:none;font-size:.9rem;font-weight:500;box-shadow:0 8px 26px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18)}
.fab svg{width:24px;height:24px;fill:#fff}
.fab span{display:none}
@media(min-width:620px){.fab span{display:inline}}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);padding:12px 20px;background:var(--navy-700);border:1px solid var(--gold);color:var(--ink);font-size:.92rem;border-radius:var(--radius);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:none}
.bottle{max-width:100%;height:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

  var raw = store.get("nb_cart") || [], out = [];
  raw.forEach(function (it) {
    if (!it || !(it.qty > 0)) return;
    if (it.type === "set") {
      if (Array.isArray(it.picks) && it.picks.length === S.discovery.pickCount && it.picks.every(byId)) out.push({ type: "set", picks: it.picks, qty: Math.min(99, it.qty | 0) });
    } else {
      var p = byId(it.id);
      if (p && p.sizes.some(function (s) { return s.ml === it.ml; })) out.push({ type: "product", id: it.id, ml: it.ml, qty: Math.min(99, it.qty | 0) });
    }
  });
  out.forEach(function (it) { it.k = itemKey(it); });
  return out;
}

function cartCount() { return state.cart.reduce(function (n, it) { return n + it.qty; }, 0); }

  return validPrice(v) ? v : null;
}

  var total = 0, unpriced = 0;

  return { total: total, unpriced: unpriced };
}
function addItem(it) {
  it.k = itemKey(it);

}

}

function buildMessage(items, form, pay) {

  if (form.phone) L.push(m.phone + ": " + form.phone);
  if (form.name || form.phone) L.push("");
  L.push(m.order + ":");
  items.forEach(function (it) {
    var u = unitPrice(it), price = u === null ? m.priceTbc : fmtNum(u) + " " + t("iqd") + " " + m.each;
    if (it.type === "set") L.push("- " + m.setLine + ": " + it.picks.map(function (id) { return pname(byId(id)); }).join(", ") + " × " + it.qty + " — " + price);
    else L.push("- " + pname(byId(it.id)) + " (" + sizeText(it.ml) + ") × " + it.qty + " — " + price);
  });
  var tt = totals(items);
  L.push("", m.total + ": " + (tt.unpriced ? m.totalTbc : fmtNum(tt.total) + " " + t("iqd")));
  if (pay) L.push("", m.pay + ": " + t("payName")[pay]);
  if (form.address) L.push(m.addr + ": " + form.address);

/* ---------- routing / render ---------- */
function parseRoute(path) {
  var p = path.replace(/^#/, "") || "/", parts = p.split("/").filter(Boolean);
  if (!parts.length) return { name: "home" };
  if (parts[0] === "product" && parts[1]) return { name: "product", slug: parts[1] };
  if (["collection", "discovery", "cart", "checkout"].indexOf(parts[0]) > -1) return { name: parts[0] };
  if (["about", "faq", "contact"].indexOf(parts[0]) > -1) return { name: "home", anchor: parts[0] };
  return { name: "404" };
}
function render(keep) {
  var y = window.scrollY, r = parseRoute(state.route), html, title = B.name;
  switch (r.name) {
    case "home": html = viewHome(); break;
    case "collection": html = viewCollection(); title = t("colTitle") + " — " + B.name; break;
    case "product": html = viewProduct(r.slug); var pp = bySlug(r.slug); if (pp) title = pname(pp) + " — " + B.name; break;
    case "discovery": html = viewDiscovery(); title = t("setName") + " — " + B.name; break;
    case "cart": html = viewCart(); title = t("cartTitle") + " — " + B.name; break;
    case "checkout": html = viewCheckout(); title = t("coTitle") + " — " + B.name; break;
    default: html = viewNotFound();
  }
  $("#app").innerHTML = html;
  renderHeader(); renderFooter();
  try { document.title = title; } catch (e) {}
  if (keep) window.scrollTo(0, y);
  else if (r.anchor) { var el = document.getElementById(r.anchor); if (el) el.scrollIntoView(); else window.scrollTo(0, 0); }
  else window.scrollTo(0, 0);
}
function go(path) {
  if (path === state.route && !/^\/(about|faq|contact)$/.test(path)) { window.scrollTo(0, 0); return; }
  var prev = state.route; state.route = path; state.menu = false;
  if (prev.split("/")[1] !== "product" || path.split("/")[2] !== prev.split("/")[2]) state.pp = { ml: null, qty: 1 };
  try { if (location.hash !== "#" + path) location.hash = path; } catch (e) {}
  render(false);
}
window.addEventListener("hashchange", function () {
  var p = location.hash.replace(/^#/, "") || "/";
  if (p !== state.route && p.charAt(0) === "/") { state.route = p; state.menu = false; render(false); }
});

function setLang(l) {
  state.lang = l; store.set("nb_lang", l);
  document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  render(true);
}
var toastTimer;
function toast(msg) {
  var el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("on"); }, 2400);
}

/* ---------- validation ---------- */
function validateForm() {
  var f = state.form, ok = true;
  function mark(id, bad, msg) {
    var inp = $("#f-" + id), er = $("#e-" + id);
    if (inp) inp.setAttribute("aria-invalid", bad ? "true" : "false");
    if (er) er.textContent = bad ? msg : "";
    if (bad) ok = false;
  }
  mark("name", (f.name || "").trim().length < 2, t("errName"));
  var digits = (f.phone || "").replace(/[^\d]/g, "");
  mark("phone", !/^\+?[\d\s\-]{10,16}$/.test((f.phone || "").trim()) || digits.length < 10 || digits.length > 15, t("errPhone"));
  mark("address", (f.address || "").trim().length < 5, t("errAddress"));
  if (!ok) { var first = $('#co-form [aria-invalid="true"]'); if (first) first.focus(); }
  return ok;
}

/* ---------- events ---------- */
document.addEventListener("click", function (e) {
  var goEl = e.target.closest("[data-go]");
  if (goEl && !e.target.closest("[data-act]")) { e.preventDefault(); go(goEl.getAttribute("data-go")); return; }
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act"), id = el.getAttribute("data-id"), d = parseInt(el.getAttribute("data-d"), 10), k = el.getAttribute("data-k");
  var isLink = el.tagName === "A";
  if (el.getAttribute("aria-disabled") === "true") {
    e.preventDefault();
    if (act === "add-set" || act === "wa-set") toast(t("discNeed"));
    return;
  }
  switch (act) {
    case "lang": setLang(state.lang === "en" ? "ar" : "en"); break;
    case "menu": state.menu = !state.menu; renderHeader(); break;
    case "add": {
      var p = byId(id), sel = $("#sz-" + id), ml = sel ? parseInt(sel.value, 10) : p.sizes[0].ml;
      addItem({ type: "product", id: id, ml: ml, qty: 1 }); toast(t("added") + ": " + pname(p) + " (" + sizeText(ml) + ")"); break;
    }
    case "add-pp": {
      var pr = bySlug(state.route.split("/")[2]);
      addItem({ type: "product", id: pr.id, ml: state.pp.ml, qty: state.pp.qty }); toast(t("added") + ": " + pname(pr)); break;
    }
    case "pp-size": state.pp.ml = parseInt(el.getAttribute("data-ml"), 10); render(true); break;
    case "pp-qty": state.pp.qty = Math.max(1, Math.min(99, state.pp.qty + d)); render(true); break;
    case "set-qty": state.setQty = Math.max(1, Math.min(99, state.setQty + d)); render(true); break;
    case "pick": {
      var i = state.picks.indexOf(id);
      if (i > -1) state.picks.splice(i, 1);
      else if (state.picks.length >= S.discovery.pickCount) { toast(t("discMax")); break; }
      else state.picks.push(id);
      render(true); break;
    }
    case "add-set":
      addItem({ type: "set", picks: state.picks.slice(), qty: state.setQty }); toast(t("added") + ": " + t("setName")); break;
    case "cart-qty": {
      var it = state.cart.filter(function (c) { return c.k === k; })[0];
      if (it) { it.qty = Math.max(1, Math.min(99, it.qty + d)); saveCart(); render(true); }
      break;
    }
    case "cart-rm": state.cart = state.cart.filter(function (c) { return c.k !== k; }); saveCart(); render(true); break;
    case "clear": state.cart = []; saveCart(); render(true); break;
    case "copy": {
      var v = el.getAttribute("data-v");
      try { navigator.clipboard.writeText(v).then(function () { toast(t("copied")); }, function () { toast(t("copyFail")); }); } catch (err) { toast(t("copyFail")); }
      break;
    }
    case "wa-card": {
      var pc = byId(id), s2 = $("#sz-" + id), m2 = s2 ? parseInt(s2.value, 10) : pc.sizes[0].ml;
      el.href = waUrl([{ type: "product", id: id, ml: m2, qty: 1 }], state.form, null); break;
    }
    case "wa-pp": {
      var pq = bySlug(state.route.split("/")[2]);
      el.href = waUrl([{ type: "product", id: pq.id, ml: state.pp.ml, qty: state.pp.qty }], state.form, null); break;
    }
    case "wa-set": el.href = waUrl([{ type: "set", picks: state.picks.slice(), qty: state.setQty }], state.form, null); break;
    case "wa-cart":
      if (!state.cart.length) { e.preventDefault(); toast(t("errCart")); break; }
      el.href = waUrl(state.cart, state.form, state.pay); break;
    case "wa-checkout":
      if (!state.cart.length) { e.preventDefault(); toast(t("errCart")); break; }
      if (!validateForm()) { e.preventDefault(); break; }
      el.href = waUrl(state.cart, state.form, state.pay);
      var nt = $("#wa-notice"); if (nt) nt.hidden = false;
      break;
  }
});
document.addEventListener("change", function (e) {
  var el = e.target;
  if (el.matches('[data-act="cart-size"]')) {
    var k = el.getAttribute("data-k"), it = state.cart.filter(function (c) { return c.k === k; })[0];
    if (it) {
      it.ml = parseInt(el.value, 10); var nk = itemKey(it), other = state.cart.filter(function (c) { return c !== it && c.k === nk; })[0];
      if (other) { other.qty = Math.min(99, other.qty + it.qty); state.cart = state.cart.filter(function (c) { return c !== it; }); } else it.k = nk;
      saveCart(); render(true);
    }
  } else if (el.matches('input[name="pay"]')) {
    state.pay = el.value; var pn = $("#pay-panel"); if (pn) pn.innerHTML = payPanel();
  }
});
document.addEventListener("input", function (e) {
  var el = e.target;
  if (el.closest && el.closest("#co-form") && el.name && el.name !== "pay") {
    state.form[el.name] = el.value; store.set("nb_form", state.form);
    if (el.getAttribute("aria-invalid") === "true") { el.setAttribute("aria-invalid", "false"); var er = $("#e-" + el.name); if (er) er.textContent = ""; }
  }
});
document.addEventListener("submit", function (e) { e.preventDefault(); });

/* ---------- boot ---------- */
state.cart = loadCart();
document.documentElement.lang = state.lang; document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
var h = (location.hash || "").replace(/^#/, "");
state.route = h.charAt(0) === "/" ? h : "/";
render(false);
window.__NB = { state: state, buildMessage: buildMessage, waUrl: waUrl, totals: totals, fmtNum: fmtNum, go: go, setLang: setLang, addItem: addItem, render: render };
})();
